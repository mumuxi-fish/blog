  <script src="../js/main.js"></script>
  <script>
    (function() {
      const tutorials = [
        { file: 'Blender学习笔记-完整版.md', name: '🎨 Blender 学习笔记', desc: 'Blender 从入门到精通的完整学习笔记' },
        { file: 'Godot学习教材-第1-8课.md', name: '🎮 Godot 学习教材', desc: 'Godot 游戏引擎第 1-8 课教材' }
      ];
      const container = document.getElementById('tutorial-list');
      container.innerHTML = '';
      tutorials.forEach(function(t, i) {
        const el = document.createElement('a');
        el.href = 'viewer.html?file=' + encodeURIComponent(t.file);
        el.className = 'project-card fade-in';
        el.style.animationDelay = (i * 0.1) + 's';
        el.innerHTML =
          '<div class="project-thumb"><span class="placeholder">' + (t.icon || '📖') + '</span></div>' +
          '<div class="project-info">' +
            '<h3>' + t.name + '</h3>' +
            '<p>' + t.desc + '</p>' +
            '<div class="project-links"><span>阅读 →</span></div>' +
          '</div>';
        container.appendChild(el);
      });
    })();
  </script>
